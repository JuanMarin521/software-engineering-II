[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemelo-digital"
version = "0.3.0"
description = "Gemelo Digital de la planta IMEC S.A.S.: telemetría, alertas, OEE y trazabilidad"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
integracion = ["psycopg[binary]"]
dev = ["pytest", "pytest-mock", "pytest-cov", "hypothesis", "ruff", "mypy", "radon", "xenon", "bandit", "mutmut", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "ce(clave): caso de prueba estructural del RTF3",
  "hu(id): historia de usuario",
  "jira(clave): tarea de JIRA",
  "integracion: requiere servicios externos",
  "rendimiento: mide tiempos; se excluye de la mutación (el entorno instrumentado los distorsiona)",
]

[tool.coverage.run]
branch = true
source = ["src/gemelo"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
extend-exclude = ["mutants"]
line-length = 125
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]
ignore = ["UP037", "UP006", "UP035", "UP045", "UP007"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["gemelo"]

[tool.mutmut]
pytest_add_cli_args = ["-m", "not rendimiento and not integracion"]
source_paths = ["src/gemelo/dominio/motor_alertas.py", "src/gemelo/dominio/clasificador_paros.py"]
also_copy = [
  "src/gemelo/__init__.py", "src/gemelo/constantes.py", "src/gemelo/errores.py",
  "src/gemelo/borde", "src/gemelo/controladores", "src/gemelo/infraestructura",
  "src/gemelo/dominio/__init__.py", "src/gemelo/dominio/tipos.py", "src/gemelo/dominio/puertos.py",
  "src/gemelo/dominio/autorizacion.py", "src/gemelo/dominio/calculador_oee.py",
  "src/gemelo/dominio/planificador_oee.py", "src/gemelo/dominio/gestor_turno.py",
]
